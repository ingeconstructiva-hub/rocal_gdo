<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- PWA: permite instalarla en la pantalla de inicio -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#20398E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS no lee el manifest para esto: necesita sus propias etiquetas -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ROCAL" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- PWA: registra el service worker que permite abrir la app sin internet.
         Los navegadores solo lo permiten en https:// o en localhost, así que
         desde una IP de red local (http://192.168.x.x) simplemente no se activa. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.log('No se pudo registrar el service worker:', error);
          });
        });
      }

      // Pide que el navegador NO borre lo guardado cuando le falte espacio.
      // Sin esto, iPhone puede tirar la cola de registros pendientes de una app
      // que no se ha abierto en semanas, y se pierde el trabajo de obra.
      if (navigator.storage && navigator.storage.persist) {
        window.addEventListener('load', function () {
          navigator.storage.persisted().then(function (yaEsPermanente) {
            if (!yaEsPermanente) navigator.storage.persist();
          });
        });
      }

      // Guarda en el caché los archivos que ya se descargaron en esta visita.
      // Hace falta porque las fuentes de los iconos se piden ANTES de que el
      // service worker tome el control: sin esto, la app abre sin iconos la
      // primera vez que se usa sin internet.
      window.addEventListener('load', function () {
        navigator.serviceWorker && navigator.serviceWorker.ready.then(function () {
          setTimeout(function () {
            try {
              var recursos = performance.getEntriesByType('resource')
                .map(function (r) { return r.name; })
                .filter(function (url) {
                  return url.indexOf(location.origin) === 0 && /\.(ttf|otf|woff2?|js|css|png|svg)(\?|$)/.test(url);
                });
              recursos.forEach(function (url) { fetch(url).catch(function () {}); });
            } catch (e) {}
          }, 2000);
        });
      });
    </script>
  </body>
</html>
